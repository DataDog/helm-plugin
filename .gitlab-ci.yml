default:
  tags: ["arch:amd64"]
  retry:
    max: 1 # Retry everything once on failure
    when: always

stages:
  - build
  - test
  - package

# Workflow rules
# Rules used to define whether a pipeline should run, and with which variables
#
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"

variables:
  GOPATH: $CI_PROJECT_DIR/.go
  GO_VERSION: "1.25.8"
  CI_IMAGE_GBI_JAMMY: registry.ddbuild.io/ci/dd-go:gbi-jammy@sha256:27a9faecce3ef65bf9879a0ae2de80e0791dbd1191213188c46bb77ee9fab78e

.go-cache:
  cache:
    key: go-mod-$CI_COMMIT_REF_SLUG-$GO_VERSION
    paths:
      - .go/pkg/mod/
    fallback_keys:
      - go-modules-prod-${GO_VERSION}

build:
  extends: .go-cache
  stage: build
  image: $CI_IMAGE_GBI_JAMMY
  script:
    - make build

test-all:
  extends: .go-cache
  stage: test
  image: $CI_IMAGE_GBI_JAMMY
  before_script:
    - apt-get update -qq && apt-get install -y -qq shellcheck
  script:
    - make ci

package:
  variables:
    VAULT_ADDR: "???????"
    VAULT_TOKEN: "!!!!!!!"
  id_tokens:
    CI_IDENTITIES_GITLAB_ID_TOKEN:
      aud: ci-identities
  stage: package
  image: "registry.ddbuild.io/ci-identities/ci-identities-gitlab-job-client"
  script:
    - ci-identities-gitlab-job-client --help
    - make install-packager
    - make package-ci
